# DigitalOcean App Platform spec (ADR 0009).
# Build from repo Dockerfile — App Platform buildpacks do not cover Java.
# Replace SECRET placeholders in the App Platform UI / secret store before deploy.
# Instance count is 2; Postgres and Redis are provisioned separately (Managed DBs).

name: distributed-rate-limiter
region: nyc
services:
  - name: api
    github:
      repo: YOUR_GITHUB_ORG/DRLService
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 2
    instance_size_slug: basic-xxs
    health_check:
      http_path: /actuator/health
      initial_delay_seconds: 40
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 6
    envs:
      - key: APP_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME
      - key: SPRING_DATASOURCE_URL
        scope: RUN_TIME
        type: SECRET
        value: jdbc:postgresql://YOUR_PG_HOST:25060/defaultdb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        scope: RUN_TIME
        type: SECRET
        value: doadmin
      - key: SPRING_DATASOURCE_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME
      - key: SPRING_DATA_REDIS_HOST
        scope: RUN_TIME
        type: SECRET
        value: YOUR_REDIS_HOST
      - key: SPRING_DATA_REDIS_PORT
        scope: RUN_TIME
        value: "25061"
      - key: SPRING_DATA_REDIS_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME
      - key: APP_RATE_LIMIT_COUNTER_SHARDS
        scope: RUN_TIME
        value: "1"
